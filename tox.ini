[tox]
envlist = lint, py311, py312
skip_missing_interpreters = true
# The package is tested from the source tree (pytest pythonpath config),
# so tox does not need to build an sdist/wheel.
no_package = true

[testenv]
description = Run the test suite with pytest
deps =
    numpy >=1.24,<2
    scipy >=1.11,<2
    pytest >=8
commands =
    pytest {posargs}

[testenv:lint]
description = Run ruff over the package and tests
deps =
    ruff >=0.8
commands =
    ruff check philsol tests
