[tool.poetry]
name = "philsol"
version = "1.0"
description = "A fully vectorial finite difference waveguide mode solver. Based on the algorithm of Zhu and Brown"

license = "GNU GPL"

authors = [
    "Phil Main <philmain28@gmail.com>"
]

readme = 'README.md'  # Markdown files are supported

repository = "https://github.com/philmain28/philsol"
homepage = "https://github.com/philmain28/philsol"

keywords = ['vector', 'finite difference', 'waveguide', 'mode solver']

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.24"
scipy = "^1.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Pin the rule set so new ruff releases cannot silently add rules; the
# legacy code is not ready for the full default set (UP, PL, ...).
select = ["E4", "E7", "E9", "F"]
